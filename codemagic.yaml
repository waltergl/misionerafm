workflow:
  name: Android Build
  max_build_duration: 60
  instance_type: mac_mini_m1
  stage:
    - build
  triggering:
    events:
      - push
  build:
    scripts:
      - name: Flutter build AAB
        script: |
          flutter pub get
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab